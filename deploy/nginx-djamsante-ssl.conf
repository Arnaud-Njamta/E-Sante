# HTTPS pour la téléconsultation (WebRTC)
# La visioconférence nécessite HTTPS — HTTP bloque caméra/micro.
#
# Prérequis : un nom de domaine pointant vers le VPS (ex. djamsante.cm)
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d votredomaine.cm
#
# Puis dans .env :
#   FRONTEND_URL=https://votredomaine.cm
#   API_PUBLIC_URL=https://votredomaine.cm/api

server {
    listen 80;
    listen [::]:80;
    server_name votredomaine.cm www.votredomaine.cm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votredomaine.cm www.votredomaine.cm;

    # Certbot remplit ces lignes :
    # ssl_certificate /etc/letsencrypt/live/votredomaine.cm/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/votredomaine.cm/privkey.pem;

    client_max_body_size 12M;

    root /var/www/djamsante-front;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
