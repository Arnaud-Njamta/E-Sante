# DjamSanté — VPS IP unique (31.70.132.160)
# Front : /var/www/djamsante-front
# API   : Node.js port 3000
#
# Installation :
#   sudo cp deploy/nginx-djamsante-vps.conf /etc/nginx/sites-available/djamsante
#   sudo ln -sf /etc/nginx/sites-available/djamsante /etc/nginx/sites-enabled/djamsante
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 31.70.132.160 _;

    client_max_body_size 12M;

    root /var/www/djamsante-front;
    index index.html;

    # ===== API Node.js (DOIT être AVANT location /) =====
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fichiers uploadés via API (si besoin)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
    }

    # Cache long pour assets Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA React — jamais pour /api
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
